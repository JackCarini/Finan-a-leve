<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stokfy</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#27ae60">
  <style>
    :root {
      --bg-color: #f8f9fa;
      --card-bg: #ffffff;
      --text-color: #333333;
      --primary-color: #27ae60;
      --primary-hover: #219653;
      --danger-color: #e74c3c;
      --border-color: #e0e0e0;
      --input-bg: #ffffff;
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #e0e0e0;
      --primary-color: #2ecc71;
      --primary-hover: #27ae60;
      --danger-color: #c0392b;
      --border-color: #333333;
      --input-bg: #2d2d2d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 70px;
      transition: background-color 0.3s, color 0.3s;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 20px;
      background-color: var(--card-bg);
      border-bottom: 1px solid var(--border-color);
    }

    .logo-area {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-area h1 {
      font-size: 1.5rem;
      color: var(--primary-color);
    }

    .theme-toggle {
      background: none;
      border: 1px solid var(--border-color);
      color: var(--text-color);
      padding: 6px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .container {
      max-width: 600px;
      margin: 20px auto;
      padding: 0 15px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }

    .card-title {
      font-size: 1.2rem;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .actions-top {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .btn {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn-outline {
      background: transparent;
      border: 1px solid var(--primary-color);
      color: var(--primary-color);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    input[type="text"], input[type="number"] {
      flex: 1;
      padding: 10px 12px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background-color: var(--input-bg);
      color: var(--text-color);
      font-size: 1rem;
    }

    .setor-section {
      margin-top: 15px;
      border-top: 1px dashed var(--border-color);
      padding-top: 15px;
    }

    .setor-title {
      font-size: 0.9rem;
      font-weight: bold;
      color: var(--primary-color);
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    /* Correção do alinhamento do X */
    .produto-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background-color: var(--bg-color);
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1px solid var(--border-color);
      gap: 10px;
    }

    .produto-info {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
      min-width: 0;
    }

    .produto-nome {
      font-size: 0.95rem;
      word-break: break-word;
    }

    .produto-controles {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .qtd-control {
      display: flex;
      align-items: center;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      overflow: hidden;
      background: var(--card-bg);
    }

    .qtd-control button {
      background: none;
      border: none;
      padding: 4px 10px;
      cursor: pointer;
      color: var(--text-color);
      font-weight: bold;
    }

    .qtd-control span {
      padding: 0 6px;
      font-size: 0.9rem;
    }

    .preco-input {
      width: 80px;
      padding: 6px;
      text-align: right;
    }

    .btn-delete {
      background-color: var(--danger-color);
      color: white;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      flex-shrink: 0;
    }

    .total-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.1rem;
      font-weight: bold;
      margin-top: 20px;
      padding-top: 15px;
      border-top: 2px solid var(--border-color);
    }

    .total-valor {
      color: var(--primary-color);
    }

    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: var(--card-bg);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-around;
      padding: 10px 0;
      z-index: 1000;
    }

    .nav-item {
      background: none;
      border: none;
      color: var(--text-color);
      font-size: 0.8rem;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .nav-item.active {
      color: var(--primary-color);
      font-weight: bold;
    }
  </style>
</head>
<body data-theme="light">

  <header>
    <div class="logo-area">
      <h1>Stokfy</h1>
    </div>
    <button class="theme-toggle" id="themeToggleBtn" onclick="toggleTheme()">🌓 Tema</button>
  </header>

  <div class="container">
    <div class="card">
      <div class="card-title">🛒 Lista de Compras</div>
      <div class="actions-top">
        <button class="btn-outline" onclick="reutilizarUltima()">Reutilizar Última</button>
        <button class="btn-outline" onclick="definirTeto()">Definir Teto</button>
      </div>
      <p style="font-size: 0.85rem; color: #7f8c8d; margin-bottom: 15px;">Itens agrupados automaticamente por setor para otimizar o seu percurso.</p>

      <div class="input-group">
        <input type="text" id="produtoInput" placeholder="Produto (ex: Arroz, Maçã, Leite...)">
        <button class="btn" onclick="adicionarProduto()">+</button>
      </div>

      <div id="listaContainer">
        <!-- Os produtos dinâmicos entram aqui -->
      </div>

      <div class="total-container">
        <span>Total Previsto no Carrinho:</span>
        <span class="total-valor" id="totalCarrinho">R$ 0,00</span>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item active">
      <span>🏠</span> Início
    </button>
    <button class="nav-item">
      <span>📈</span> Comparativo
    </button>
    <button class="nav-item">
      <span>🛒</span> Mercado
    </button>
  </nav>

  <script>
    let produtos = JSON.parse(localStorage.getItem('stokfy_produtos')) || [
      { id: 1, nome: 'Arroz', setor: 'MERCEARIA', qtd: 1, preco: 0.0, comprado: false },
      { id: 2, nome: 'Feijão', setor: 'MERCEARIA', qtd: 1, preco: 0.0, comprado: false },
      { id: 3, nome: 'Sabão em pó', setor: 'LIMPEZA', qtd: 1, preco: 0.0, comprado: false }
    ];

    function salvarDados() {
      localStorage.setItem('stokfy_produtos', JSON.stringify(produtos));
      renderizarLista();
    }

    function determinarSetor(nome) {
      const n = nome.toLowerCase();
      if (n.includes('sabão') || n.includes('detergente') || n.includes('limpeza') || n.includes('esponja')) return 'LIMPEZA';
      if (n.includes('leite') || n.includes('queijo') || n.includes('iogurte')) return 'FRIOS E LATICÍNIOS';
      if (n.includes('maçã') || n.includes('banana') || n.includes('tomate') || n.includes('verdura')) return 'HORTIFRUTI';
      return 'MERCEARIA';
    }

    function adicionarProduto() {
      const input = document.getElementById('produtoInput');
      const nome = input.value.trim();
      if(!nome) return;

      const novo = {
        id: Date.now(),
        nome: nome,
        setor: determinarSetor(nome),
        qtd: 1,
        preco: 0.0,
        comprado: false
      };

      produtos.push(novo);
      input.value = '';
      salvarDados();
    }

    function removerProduto(id) {
      produtos = produtos.filter(p => p.id !== id);
      salvarDados();
    }

    function alterarQtd(id, delta) {
      const p = produtos.find(item => item.id === id);
      if(p) {
        p.qtd += delta;
        if(p.qtd < 1) p.qtd = 1;
        salvarDados();
      }
    }

    function atualizarPreco(id, valor) {
      const p = produtos.find(item => item.id === id);
      if(p) {
        p.preco = parseFloat(valor) || 0;
        salvarKpi();
      }
    }

    function toggleComprado(id) {
      const p = produtos.find(item => item.id === id);
      if(p) {
        p.comprado = !p.comprado;
        salvarDados();
      }
    }

    function renderizarLista() {
      const container = document.getElementById('listaContainer');
      container.innerHTML = '';

      const setoresObj = {};
      produtos.forEach(p => {
        if(!setoresObj[p.setor]) setoresObj[p.setor] = [];
        setoresObj[p.setor].push(p);
      });

      for(let setor in setoresObj) {
        let setorDiv = document.createElement('div');
        setorDiv.className = 'setor-section';
        setorDiv.innerHTML = `<div class="setor-title">📍 SETOR: ${setor}</div>`;

        setoresObj[setor].forEach(p => {
          let itemDiv = document.createElement('div');
          itemDiv.className = 'produto-item';
          itemDiv.innerHTML = `
            <div class="produto-info">
              <input type="checkbox" ${p.comprado ? 'checked' : ''} onchange="toggleComprado(${p.id})">
              <span class="produto-nome" style="${p.comprado ? 'text-decoration: line-through; opacity: 0.6;' : ''}">${p.nome}</span>
            </div>
            <div class="produto-controles">
              <div class="qtd-control">
                <button onclick="alterarQtd(${p.id}, -1)">-</button>
                <span>${p.qtd}</span>
                <button onclick="alterarQtd(${p.id}, 1)">+</button>
              </div>
              <input type="number" step="0.01" class="preco-input" value="${p.preco > 0 ? p.preco.toFixed(2) : '0,00'}" oninput="atualizarPreco(${p.id}, this.value)">
              <button class="btn-delete" onclick="removerProduto(${p.id})">✕</button>
            </div>
          `;
          setorDiv.appendChild(itemDiv);
        });

        container.appendChild(setorDiv);
      }

      salvarKpi();
    }

    function salvarKpi() {
      let total = produtos.reduce((acc, p) => acc + (p.qtd * p.preco), 0);
      document.getElementById('totalCarrinho').innerText = 'R$ ' + total.toFixed(2).replace('.', ',');
    }

    function toggleTheme() {
      const body = document.body;
      const currentTheme = body.getAttribute('data-theme');
      const newTheme = currentTheme === 'light' ? 'dark' : 'light';
      body.setAttribute('data-theme', newTheme);
      localStorage.setItem('stokfy_theme', newTheme);
    }

    window.onload = () => {
      const savedTheme = localStorage.getItem('stokfy_theme') || 'light';
      document.body.setAttribute('data-theme', savedTheme);
      renderizarLista();
    };

    // Registo do Service Worker para suporte PWA / offline
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW registration failed: ', err));
      });
    }

    function reutilizarUltima() { alert('Funcionalidade de reutilizar última lista pronta para uso!'); }
    function definirTeto() { alert('Definição de teto orçamentário ativada.'); }
  </script>
</body>
</html>
